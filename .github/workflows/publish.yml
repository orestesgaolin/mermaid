name: Publish Mermaid packages

on:
  push:
    tags:
      - 'mermaid-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Check tag and package versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#mermaid-v}"
          core_version="$(sed -n 's/^version: //p' packages/mermaid_core/pubspec.yaml)"
          flutter_version="$(sed -n 's/^version: //p' packages/mermaid_flutter/pubspec.yaml)"

          if [[ "$core_version" != "$version" || "$flutter_version" != "$version" ]]; then
            echo "Tag version:             $version"
            echo "mermaid_core version:    $core_version"
            echo "mermaid_flutter version: $flutter_version"
            exit 1
          fi

      - name: Check tag commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze packages/mermaid_core packages/mermaid_flutter

      - name: Test mermaid_core
        run: dart test packages/mermaid_core

      - name: Test mermaid_flutter
        run: flutter test packages/mermaid_flutter

      - name: Check mermaid_core package
        working-directory: packages/mermaid_core
        run: dart pub publish --dry-run

      - name: Check mermaid_flutter package
        working-directory: packages/mermaid_flutter
        run: flutter pub publish --dry-run

      - name: Generate release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#mermaid-v}"
          dart pub global activate changelog_cli 0.9.1
          previous="$(git describe --tags --abbrev=0 --match='mermaid-v*' "$GITHUB_SHA^" 2>/dev/null || true)"
          args=(
            generate
            --path .
            --end "$GITHUB_SHA"
            --version "$version"
            --printer markdown
            --output release-notes.md
          )
          if [[ -n "$previous" ]]; then
            args+=(--start "$previous")
          fi
          dart pub global run changelog_cli:changelog_cli "${args[@]}"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Approve and publish
    needs: prepare
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      # setup-dart exchanges GitHub's OIDC identity for the short-lived
      # pub.dev token used by both `dart pub` and `flutter pub` below.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Resolve dependencies
        run: flutter pub get

      - name: Publish mermaid_core
        working-directory: packages/mermaid_core
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#mermaid-v}"
          if curl --fail --silent https://pub.dev/api/packages/mermaid_core \
            | jq --exit-status --arg version "$version" 'any(.versions[]; .version == $version)' >/dev/null; then
            echo "mermaid_core $version is already published"
          else
            dart pub publish --force
          fi

      - name: Wait for mermaid_core on pub.dev
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#mermaid-v}"
          for attempt in {1..30}; do
            if curl --fail --silent https://pub.dev/api/packages/mermaid_core \
              | jq --exit-status --arg version "$version" 'any(.versions[]; .version == $version)' >/dev/null; then
              exit 0
            fi
            echo "Attempt $attempt: waiting for mermaid_core $version"
            sleep 10
          done
          echo "mermaid_core $version did not become available within five minutes"
          exit 1

      - name: Publish mermaid_flutter
        working-directory: packages/mermaid_flutter
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#mermaid-v}"
          if curl --fail --silent https://pub.dev/api/packages/mermaid_flutter \
            | jq --exit-status --arg version "$version" 'any(.versions[]; .version == $version)' >/dev/null; then
            echo "mermaid_flutter $version is already published"
          else
            flutter pub publish --force
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
